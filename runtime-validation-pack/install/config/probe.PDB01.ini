; ==== LSAX PHASE 0 RUNTIME VALIDATION PACK - probe.ini profile PDB01 ====
; P-DB-01 steps 2-3 and smoke S9: NativePath = <scripts>\LSAXProbeSql\e_sqlite3.dll (filled in by the pack script).
; Generated from phase0-probes/probe.ini.sample (DRAFT2). Installed by INSTALL-PROBES / SET-PROBE-CONFIG.
; P-SL-02 (AnchorProbe) stays DISABLED in every profile of this pack.
;
; LSAX Phase 0 disposable probe configuration. Copy to GTA V/scripts/LSAXProbe/probe.ini
; NOT LSAX production configuration.

; P-SL-01. Comma-separated stat names to TEST for existence/persistence (hypotheses, not facts; max 16).
PlaytimeStatCandidates=TOTAL_PLAYING_TIME,SP0_TOTAL_PLAYING_TIME,SP1_TOTAL_PLAYING_TIME,SP2_TOTAL_PLAYING_TIME,LEADERBOARD_PLAYING_TIME
; P-SL-01 session token: one runtime int decorator on the player ped (PC-5/PC-7). false disables it.
SessionToken.Enabled=true
; Override only if your saves are elsewhere.
; SaveRoot=C:\Users\<you>\Documents\Rockstar Games\GTA V\Profiles

; P-SL-02 (writes SP stats; disposable save only)
AnchorProbe.Enabled=false
AnchorProbe.Consent=
AnchorProbe.CandidateStats=
AnchorProbe.WriteKey=F9
AnchorProbe.RestoreKey=F11

; P-ID-01
IdentityProbe.Enabled=false
IdentityProbe.TagKey=F10

; P-DB-01
SqliteProbe.Enabled=true
; DRAFT2 sample path runtimes\win-x64\native\ does not exist in the win-x64 build output; the file is LSAXProbeSql\e_sqlite3.dll
SqliteProbe.NativePath=@@SQLITE_NATIVE_PATH@@
SqliteProbe.CloseOnAbort=true
